<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>.err {color:red}</style>
  <title th:text="${title}"></title>
</head>
<body  class="container mt-4">
  <h2 th:text="${title}"></h2>

  <!-- 読書記録 更新form -->
  <form th:action="@{/edit}" method="post" th:object="${formModel}">
    <!-- 更新対象のID（隠しフィールド） -->
    <input type="hidden" th:field="*{id}">

    <!-- 作品名選択プルダウン -->
    <div class="mb-3 d-flex align-items-center">
      <label for="work.id" class="form-label me-3 mb-0" style="width: 120px;">作品名：</label>
      <select class="form-select w-auto" th:field="*{work.id}">
        <option th:each="item : ${wklist}" th:value="${item.id}" th:text="|${item.title} （著：${item.author.name}）|"></option>
      </select>
    </div>

    <!-- 読了日入力 -->
    <div class="mb-3 d-flex align-items-center">
      <label for="finishedDate" class="form-label me-3 mb-0" style="width: 120px;">読了日：</label>
      <input type="date" class="form-control w-auto" th:field="*{finishedDate}" th:errorclass="is-invalid">
      <div class="invalid-feedback ms-2" th:if="${#fields.hasErrors('finishedDate')}" th:errors="*{finishedDate}"></div>
    </div>

    <!-- メモ入力 -->
    <div class="mb-3 d-flex align-items-center">
      <label for="memo" class="form-label me-3 mb-0" style="width: 120px;">メモ：</label>
      <input type="text" class="form-control w-auto" th:field="*{memo}">
      <div class="invalid-feedback ms-2" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></div>
    </div>

    <!-- 評価選択 -->
    <div class="mb-3 d-flex align-items-center">
      <label for="rating" class="form-label me-3 mb-0" style="width: 120px;">評価(1~5)：</label>
      <select class="form-select w-auto" th:field="*{rating}">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <!-- 更新（登録）ボタン -->
    <button class="btn btn-primary mt-2 mb-2" type="submit">更新</button>
  </form>

  <!-- 戻るボタン -->
  <div class="mt-3">
    <form th:action="@{/readingMng}" method="get" class="d-inline">
      <button type="submit" class="btn btn-secondary">戻る</button>
    </form>
  </div>

</body>
</html>
